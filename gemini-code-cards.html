<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartoon Character Gallery</title>
  <!-- Google Fonts for Cartoon Style -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;900&family=Luckiest+Guy&display=swap" rel="stylesheet">
  
  <style>
    /* --- COLOR THEMES (10 Variants: Mix of Light & Dark) --- */
    :root {
      /* Theme 1: Bubblegum Pop (Light Default) */
      --bg-color: #ffb7b2;
      --panel-bg: #fff;
      --card-bg: #ffdac1;
      --text-color: #2b2d42;
      --border-color: #000000;
      --accent-color: #ff477e;
      --shadow-color: #000000;
    }

    body[data-theme="2"] { /* Neon Midnight (Dark) */
      --bg-color: #0f172a; --panel-bg: #1e293b; --card-bg: #334155;
      --text-color: #f8fafc; --border-color: #000000; --accent-color: #38bdf8;
    }
    body[data-theme="3"] { /* Minty Fresh (Light) */
      --bg-color: #b7e4c7; --panel-bg: #ffffff; --card-bg: #d8f3dc;
      --text-color: #1b4332; --border-color: #1b4332; --accent-color: #52b788;
    }
    body[data-theme="4"] { /* Toxic Slime (Dark) */
      --bg-color: #250036; --panel-bg: #3c005a; --card-bg: #11001c;
      --text-color: #39ff14; --border-color: #39ff14; --accent-color: #bc00dd;
    }
    body[data-theme="5"] { /* Banana Split (Light) */
      --bg-color: #fef08a; --panel-bg: #ffffff; --card-bg: #fef9c3;
      --text-color: #713f12; --border-color: #713f12; --accent-color: #ca8a04;
    }
    body[data-theme="6"] { /* Deep Ocean (Dark) */
      --bg-color: #03045e; --panel-bg: #023e8a; --card-bg: #0077b6;
      --text-color: #caf0f8; --border-color: #000000; --accent-color: #00b4d8;
    }
    body[data-theme="7"] { /* Lavender Dream (Light) */
      --bg-color: #e9d5ff; --panel-bg: #ffffff; --card-bg: #f3e8ff;
      --text-color: #581c87; --border-color: #581c87; --accent-color: #a855f7;
    }
    body[data-theme="8"] { /* Lava Cave (Dark) */
      --bg-color: #1c1917; --panel-bg: #292524; --card-bg: #44403c;
      --text-color: #f97316; --border-color: #000000; --accent-color: #ef4444;
    }
    body[data-theme="9"] { /* Sky High (Light) */
      --bg-color: #bae6fd; --panel-bg: #ffffff; --card-bg: #e0f2fe;
      --text-color: #0369a1; --border-color: #0369a1; --accent-color: #38bdf8;
    }
    body[data-theme="10"] { /* Cyberpunk (Dark) */
      --bg-color: #ff0055; --panel-bg: #2d00f7; --card-bg: #10002b;
      --text-color: #00f5d4; --border-color: #00f5d4; --accent-color: #ff0055;
    }

    /* --- GLOBAL STYLES --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Fredoka', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* Kept full screen without standard scrolling if possible */
      transition: background-color 0.4s ease, color 0.4s ease;
      cursor: pointer; /* Indicates the whole background is clickable */
    }

    /* Prevent clicking layout elements from stopping the background toggle if desired, 
       but we will handle it explicitly in JS */
    header {
      text-align: center;
      padding: 15px 10px 5px 10px;
      pointer-events: none; /* Clicks pass through to body */
    }

    header h1 {
      font-family: 'Luckiest Guy', cursive;
      font-size: 3rem;
      letter-spacing: 2px;
      text-shadow: 4px 4px 0px var(--border-color);
      -webkit-text-stroke: 2px var(--border-color);
      color: #fff;
    }

    header p {
      font-size: 1.1rem;
      font-weight: 900;
      text-transform: uppercase;
      background: var(--panel-bg);
      display: inline-block;
      padding: 4px 12px;
      border: 3px solid var(--border-color);
      border-radius: 20px;
      margin-top: 5px;
      box-shadow: 3px 3px 0px var(--border-color);
    }

    /* --- MAIN RESPONSIVE CARTOON GRID --- */
    .grid-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 15px;
      padding: 20px;
      width: 100%;
      height: calc(100vh - 120px);
      max-height: 100%;
      box-sizing: border-box;
    }

    /* --- CARD STYLING --- */
    .card {
      background-color: var(--panel-bg);
      border: 4px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 6px 6px 0px var(--shadow-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.4s ease;
      cursor: default;
      pointer-events: auto; /* Stops click-through so clicking a card won't accidentally trigger theme change */
    }

    .card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 8px 8px 0px var(--shadow-color);
    }

    .image-container {
      flex: 1;
      background-color: var(--card-bg);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 4px solid var(--border-color);
      transition: background-color 0.4s ease;
    }

    .character-img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      image-rendering: auto;
    }

    /* Comic Style Text Label */
    .card-title {
      padding: 8px 5px;
      text-align: center;
      font-weight: 900;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background-color: var(--panel-bg);
      text-transform: uppercase;
      transition: background-color 0.4s ease;
    }

    /* --- MYSTERY OVERLAY STYLES --- */
    .mystery-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* Silhouette effect for the image behind the overlay */
    .card.mystery .character-img {
      filter: brightness(0);
    }

    .mystery-symbol {
      font-family: 'Luckiest Guy', cursive;
      font-size: 4rem;
      color: var(--accent-color);
      text-shadow: 4px 4px 0px #000;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* --- RESPONSIVE BREAKPOINTS --- */
    /* Maintain 6x3 on large setups, scale down on smaller viewports gracefully */
    @media (max-width: 1200px) {
      .card-title { font-size: 0.85rem; }
    }

    @media (max-width: 900px) {
      /* Adapt the 18 cards safely for portrait/smaller mobile views so it's usable */
      .grid-container {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(6, 1fr);
        overflow-y: auto;
        height: auto;
      }
      body { overflow-y: auto; }
      header h1 { font-size: 2.2rem; }
    }

    @media (max-width: 480px) {
      .grid-container {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(9, 1fr);
        gap: 10px;
        padding: 10px;
      }
      header h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>POP PLAYTIME GALLERY</h1>
    <p>Tap Background to Change Theme</p>
  </header>

  <div class="grid-container" id="cardGrid">
    <!-- Cards will be dynamically injected here -->
  </div>

  <script>
    // 1. Comprehensive Character Pool Array
    const characterPool = [
      'Allister Gator', 'Baba Chops', 'Baby Long Legs', 'Barry', 'Bindle Boogie', 
      'Boxy Boo', 'Bron Toy', 'Bubba Bubbaphant', 'Bunzo Bunny', 'Candy Cat Toy', 
      'CatNap Monster', 'CatNap Plush', 'CatNap', 'Chum Chompkins', 'CraftyCorn', 
      'Daddy Long Legs', 'Daisy', 'Dizzy Booboo', 'Doey', 'DogDay Critter', 
      'DogDay', 'Doodle Bones', 'Giblet', 'Glowby', 'Goober Gutz', 
      'Hoppy Hopscotch', 'Huggy Wuggy', 'Icky Licky', 'KickinChicken', 'Kissy Missy', 
      'Lily Lovebraids', 'Loopsy Noodle', 'Mini Huggies', 'Miss Delight', 'Mommy Long Legs', 
      'Passive Doctor', 'Pianosaurus', 'PickyPiggy', 'PJ Pug a Pillar', 'Poe', 
      'Poppy Playtime', 'Prototype', 'Rabie Baby', 'Simon Smoke', 'The Medic', 
      'The Player', 'The Scout', 'Touille', 'Yarnaby', 'Bucky', 
      'CatBee', 'Dusky', 'Limon', 'Maggie Mako', 'Kick Me Paul', 'ai'
    ];

    // Image format configuration (Change extension here if needed, e.g., '.jpg')
    const IMG_EXTENSION = '.png'; 

    // 2. Helper to get 18 unique random characters
    function getRandomCharacters(pool, count) {
      const shuffled = [...pool].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, count);
    }

    // 3. Initialize Variables
    const selectedCharacters = getRandomCharacters(characterPool, 18);
    
    // Choose exactly 6 unique indexes out of 18 to be hidden mystery cards
    const mysteryIndexes = new Set();
    while (mysteryIndexes.size < 6) {
      mysteryIndexes.add(Math.floor(Math.random() * 18));
    }

    // 4. Render Grid DOM Elements
    const gridContainer = document.getElementById('cardGrid');

    selectedCharacters.forEach((charName, index) => {
      const isMystery = mysteryIndexes.has(index);
      
      // Create Card Structure
      const card = document.createElement('div');
      card.className = `card ${isMystery ? 'mystery' : ''}`;
      
      const imgContainer = document.createElement('div');
      imgContainer.className = 'image-container';
      
      const img = document.createElement('img');
      img.className = 'character-img';
      img.src = `${charName}${IMG_EXTENSION}`;
      img.alt = charName;
      
      // Fallback styling/text placeholder if local file is missing
      img.onerror = function() {
        this.style.display = 'none';
        const placeholder = document.createElement('div');
        placeholder.innerText = isMystery ? "" : charName[0];
        placeholder.style.fontSize = '2.5rem';
        placeholder.style.fontWeight = '900';
        placeholder.style.opacity = '0.3';
        imgContainer.appendChild(placeholder);
      };

      imgContainer.appendChild(img);

      // Add overlay element if it is a random mystery card
      if (isMystery) {
        const overlay = document.createElement('div');
        overlay.className = 'mystery-overlay';
        
        const symbol = document.createElement('span');
        symbol.className = 'mystery-symbol';
        symbol.innerText = '?';
        
        overlay.appendChild(symbol);
        imgContainer.appendChild(overlay);
      }

      const title = document.createElement('div');
      title.className = 'card-title';
      title.innerText = isMystery ? '???' : charName;

      card.appendChild(imgContainer);
      card.appendChild(title);
      gridContainer.appendChild(card);
    });

    // 5. Dynamic Theme Controller Logic (10 Cycle Modes)
    let currentTheme = 1;
    const totalThemes = 10;

    document.body.addEventListener('click', (event) => {
      // Only trigger theme changes if clicking outside cards or titles
      if (!event.target.closest('.card')) {
        currentTheme = (currentTheme % totalThemes) + 1;
        document.body.setAttribute('data-theme', currentTheme);
      }
    });
  </script>
</body>
</html>
