<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Logic Game - Clean Drag</title>
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
    }

    body {
        font-family: "Comic Sans MS", "Baloo 2", cursive;
        background: var(--body-bg, linear-gradient(180deg, #1e1e2f, #252542));
        color: var(--text-color, #e0e0e0);
        height: 100vh;
        display: flex;
        flex-direction: column; /* Изменено для вертикального стекинга */
        overflow: hidden;
    }

    #play-area {
        flex: 1;
        position: relative;
        overflow: hidden;
        background: var(--play-bg, radial-gradient(circle at center, #2d2d44 0%, #151522 100%));
    }

    #sidebar {
        width: 100%;
        height: 20%;
        min-height: 130px;
        max-height: 180px;
        padding: 15px;
        overflow-x: auto;
        overflow-y: hidden;
        display: grid;
        grid-template-rows: 1fr 1fr;
        grid-auto-columns: max-content;
        grid-auto-flow: column;
        gap: 12px;

        background: var(--sidebar-bg, linear-gradient(180deg, #3a2e4d, #201a30));
        border-bottom: 6px solid #000;
        order: -1; /* Помещает панель в верхнюю часть экрана */
    }

    .item {
        width: 100%;
        aspect-ratio: 1 / 1;
        cursor: grab;

        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;

        border: 4px solid #000;
        border-radius: 20px;
        background-color: var(--item-bg, #383854);
        box-shadow: 4px 6px 0px #000;

        transition: transform 0.1s ease, opacity 0.2s ease;
    }

    /* Обеспечиваем правильный размер предметов в новой горизонтальной панели */
    #sidebar .item {
        height: 100%;
        width: auto;
    }

    .item:hover {
        transform: scale(1.08) rotate(-2deg);
    }

    .item:active {
        cursor: grabbing;
        transform: scale(0.95);
        box-shadow: 2px 3px 0px #000;
    }

    .item.disabled {
        opacity: 0.3;
        filter: grayscale(80%);
        cursor: default;
        pointer-events: none;
    }

    .board-item {
        position: absolute;
        width: 110px;
        height: 110px;
        z-index: 10;
        border: none;
        border-radius: 0;
        background-color: transparent !important;
        box-shadow: none !important;
    }

    .board-item.result-item {
        width: 160px;
        height: 160px;
        z-index: 11;
        border: none;
        border-radius: 0;
        background-color: transparent !important;
    }

    @keyframes shake {
        0% { transform: translate(2px, 2px) rotate(0deg); }
        25% { transform: translate(-3px, 0px) rotate(-2deg); }
        50% { transform: translate(3px, 2px) rotate(2deg); }
        75% { transform: translate(-2px, -1px) rotate(-2deg); }
        100% { transform: translate(2px, -2px) rotate(1deg); }
    }

    .board-item.result-item {
        filter: drop-shadow(1px 0px 0px #000) 
                drop-shadow(-1px 0px 0px #000) 
                drop-shadow(0px 1px 0px #000) 
                drop-shadow(0px -1px 0px #000);
    }

    .error-shake {
        animation: shake 0.4s;
    }

    @keyframes pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.3) rotate(5deg); }
        100% { transform: scale(1) rotate(0deg); }
    }

    .success-pop {
        animation: pop 0.35s ease-out;
    }

    /* --- СТИЛИ ДЛЯ КНИГИ И КАТАЛОГА --- */
    #overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 99;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
    }
    #overlay.active {
        opacity: 1;
        pointer-events: all;
    }

    #book-icon {
        position: fixed;
        bottom: 20px; right: 290px;
        width: 60px; height: 60px;
        background: #383854;
        border: 4px solid #000;
        border-radius: 15px;
        box-shadow: 4px 4px 0px #000;
        font-size: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        z-index: 98;
        transition: transform 0.2s;
    }
    #book-icon:hover {
        transform: scale(1.1) rotate(-5deg);
    }

    #hint-icon {
        position: fixed;
        bottom: 20px; right: 215px;
        width: 60px; height: 60px;
        background: #383854;
        border: 4px solid #000;
        border-radius: 15px;
        box-shadow: 4px 4px 0px #000;
        font-size: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        z-index: 98;
        transition: transform 0.2s;
    }
    #hint-icon:hover {
        transform: scale(1.1) rotate(5deg);
    }

    #settings-icon {
        position: fixed;
        bottom: 20px; right: 140px;
        width: 60px; height: 60px;
        background: #383854;
        border: 4px solid #000;
        border-radius: 15px;
        box-shadow: 4px 4px 0px #000;
        font-size: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        z-index: 98;
        transition: transform 0.2s;
    }
    #settings-icon:hover {
        transform: scale(1.1) rotate(-5deg);
    }

    /* Стили для нового игрового таймера справа от кнопки подсказок */
    #game-timer {
        position: fixed;
        bottom: 20px; right: 20px;
        height: 60px;
        padding: 0 20px;
        background: #383854;
        color: #e0e0e0;
        border: 4px solid #000;
        border-radius: 15px;
        box-shadow: 4px 4px 0px #000;
        font-size: 24px;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        z-index: 98;
        transition: transform 0.2s, background-color 0.3s, color 0.3s;
    }
    #game-timer:hover {
        transform: scale(1.05);
    }
    #game-timer.finished {
        background-color: #1e3a29;
        color: #66bb6a; /* Зеленый цвет текста при завершении */
        border-color: #4caf50;
        cursor: default;
    }

    #catalog-popup, #hint-popup, #settings-popup {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        width: 65%; height: 73%;
        background: #252538;
        border: 6px solid #000;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8), 10px 10px 0px rgba(0,0,0,0.9);
        z-index: 100;
        display: flex;
        flex-direction: column;
        padding: 20px;
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s ease;
    }
    #catalog-popup.active, #hint-popup.active, #settings-popup.active {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        pointer-events: all;
    }

    #close-popup, #close-hint-popup, #close-settings-popup {
        position: absolute;
        top: 10px; right: 15px;
        font-size: 30px;
        cursor: pointer;
        color: var(--text-color, #e0e0e0);
        font-weight: bold;
        transition: transform 0.2s;
    }
    #close-popup:hover, #close-hint-popup:hover, #close-settings-popup:hover {
        transform: scale(1.2);
    }

    #catalog-popup h2, #hint-popup h2, #settings-popup h2 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 28px;
        color: var(--text-heading, #fff);
    }

    #catalog-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr); 
        gap: 15px;
        overflow-y: auto;
        padding: 10px;
        flex: 1;
    }

    /* Маленькие квадратные кнопки в меню настроек */
    #theme-grid {
        display: grid;
        grid-template-columns: repeat(5, 75px);
        gap: 12px;
        justify-content: center;
        overflow-y: auto;
        padding: 10px;
        flex: 1;
    }

    .theme-option {
        width: 75px;
        height: 75px;
        border: 4px solid #000;
        border-radius: 12px;
        box-shadow: 2px 3px 0px #000;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        font-size: 11px;
        text-align: center;
        color: #fff;
        text-shadow: 1px 1px 2px #000;
        transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }
    .theme-option:hover {
        transform: scale(1.05);
    }
    .theme-option.active {
        border-color: #fff;
        box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.5), 2px 3px 0px #000;
    }

    #hint-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 10px;
    }

    .hint-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 25px;
        background: transparent;
        border: none;
        box-shadow: none;
        padding: 10px;
    }

    .hint-sign {
        font-size: 46px;
        font-weight: bold;
        color: var(--text-color, #e0e0e0);
    }

    .catalog-tile {
        width: 100%;
        aspect-ratio: 1 / 1;
        border: 4px solid #000;
        border-radius: 15px;
        background-color: #2c2c44;
        box-shadow: 2px 3px 0px #000;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.3s;
    }

    .hint-tile {
        width: 250px;
        height: 250px;
        border: none;
        background-color: transparent;
        box-shadow: none;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .catalog-img {
        width: 80%;
        height: 80%;
        object-fit: contain;
        transition: filter 0.3s ease;
    }

    .hint-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        transition: filter 0.3s ease;
    }

    .catalog-img.undiscovered, .hint-img {
        filter: brightness(0) opacity(0.7);
    }

    .board-item.result-item[data-id="A3"] {
        width: 300px;
        height: 300px;
    }

    .board-item.result-item[data-id="AB6"] {
        width: 320px;
        height: 320px;
    }

    /* Настройки скроллбара для горизонтальной и вертикальных панелей */
    #sidebar::-webkit-scrollbar {
        height: 8px; 
    }
    
    #catalog-grid::-webkit-scrollbar,
    #theme-grid::-webkit-scrollbar {
        width: 6px;
    }

    #sidebar::-webkit-scrollbar-track,
    #catalog-grid::-webkit-scrollbar-track,
    #theme-grid::-webkit-scrollbar-track {
        background: transparent;
    }

    #sidebar::-webkit-scrollbar-thumb,
    #catalog-grid::-webkit-scrollbar-thumb,
    #theme-grid::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
    }

    #sidebar::-webkit-scrollbar-thumb:hover,
    #catalog-grid::-webkit-scrollbar-thumb:hover,
    #theme-grid::-webkit-scrollbar-thumb:hover {
        background-color: rgba(255, 255, 255, 0.4);
    }

    #sidebar,
    #catalog-grid,
    #theme-grid {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }
    </style>
</head>
<body>

    <script>
        let baseItems = ['zeroa copy', 'crocodile', 'death', 'sheep', 'baby', 'nipple', 'shopping cart', 'donation', 'ogre', 'monster1', 'teddy-bear', 'heart', 'jack-in-the-box', 'spring', 'eruption', 'head', 'elephant', 'light-bulb', 'cymbal', 'rabbit', 'russian-blue', 'lollipop', 'crescent-moon1', 'black-cat1', 'crescent-moon', 'black-cat', 'british-shorthair', 'crescent-moon2', 'eye-patch', 'gloves', 'daisy2', 'unicorn', 'bow-tie', 'hat', 'plant-pot', 'flower', 'thumb-tack', 'monster', 'paint-bucket', 'dough', 'sun', 'belt', 'dog', 'sun2', 'circular-button', 'nose', 'gloves2', 'eyes', 'smile', 'beam', 'button-cross', 'zipper', 'thunder', 'rabbit2', 'hand-gloves', 'mouth', 'golden-frog', 'biohazard', 'bow', 'chick', 'gift-bow', 'kiss', 'woman', 'hair', 'cancel', 'ramen', 'puzzle', 'friends', 'princess', 'apple', 'gloves3', 'leg', 'robotic-hand', 'tv', 'tyrannosaurus', 'piano', 'apple2', 'pig', 'caterpillar', 'pug', 'rainy', 'bat', 'doll2', 'vase', 'spider', 'sign', 'blood-drop', 'rabbi', 'dragon', 'dollar', 'demolition-crane', 'first-aid-box', 'glove-red', 'glove-blue', 'joystick', 'computer', 'fish-bone', 'rat', 'lion', 'yarn', 'eyeball', 'eye', 'bucket', 'eyeballs', 'orange cat', 'bee', 'blue-button', 'dolly', 'lemon', 'happy', 'triangles', 'shark', 'pair gloves', 'ai smile', 'cap', 'orange' ];
        baseItems.sort(() => Math.random() - 0.5);
        
        const recipes = {
    'zeroa copy+crocodile': 'allister gator',
    'death+sheep': 'baba chops',
    'baby+nipple': 'baby long legs',
    'shopping cart+donation': 'barry',

    'light-bulb+elephant': 'bubba bubbaphant',
    'rabbit+cymbal': 'bunzo bunny',
    'russian-blue+lollipop': 'candy cat toy',
    'black-cat+crescent-moon': 'catnap monster',
    'british-shorthair+crescent-moon2': 'catnap plush',
    'crescent-moon1+black-cat1': 'catnap',
    'eye-patch+gloves': 'giblet',
    'daisy2+unicorn': 'craftycorn',

    'paint-bucket+dough': 'doey',
    'dog+sun2': 'dogday critter',
    'sun+belt': 'dogday',
    'circular-button+nose': 'doodle bones',
    'gloves2+eyes': 'chum chompkins',
    'smile+beam': 'glowby',
    'button-cross+zipper': 'goober gutz',
    'thunder+rabbit2': 'hoppy hopscotch',
    'hand-gloves+mouth': 'huggy wuggy',
    'golden-frog+biohazard': 'icky licky',
    'chick+bow': 'kickinchicken',
    'gift-bow+kiss': 'kissy missy',

    'robotic-hand+tv': 'passive doctor',
    'tyrannosaurus+piano': 'pianosaurus',
    'apple2+pig': 'pickypiggy',
    'caterpillar+pug': 'pj pug a pillar',
    'rainy+bat': 'poe',
    'doll2+vase': 'poppy playtime',
    'sign+spider': 'prototype',
    'blood-drop+rabbi': 'rabie baby',
    'dragon+dollar': 'simon smoke',
    'demolition-crane+first-aid-box': 'the medic',
    'glove-red+glove-blue': 'the player',
    'computer+joystick': 'the scout',
    'fish-bone+rat': 'touille',
    'lion+yarn': 'yarnaby',
    'eyeball+eye': 'outimals',
    'bucket+eyeballs': 'bucky',
    'orange cat+bee': 'catbee',
    'blue-button+dolly': 'dusky',
    'lemon+happy': 'limon',
    'triangles+shark': 'maggie mako',
    'ai smile+pair gloves': 'ai',
    'orange+cap': 'kick me paul'
};

        const discoveredItems = new Set();
        const allTargetItems = ['allister gator', 'baba chops', 'baby long legs', 'barry', 'bindle boogie', 'boxy boo', 'bron toy', 'bubba bubbaphant', 'bunzo bunny', 'candy cat toy', 'catnap monster', 'catnap plush', 'catnap', 'chum chompkins', 'craftycorn', 'daddy long legs', 'daisy', 'dizzy booboo', 'doey', 'dogday critter', 'dogday', 'doodle bones', 'giblet', 'glowby', 'goober gutz', 'hoppy hopscotch', 'huggy wuggy', 'icky licky', 'kickinchicken', 'kissy missy', 'lily lovebraids', 'loopsy noodle', 'mini huggies', 'miss delight', 'mommy long legs', 'passive doctor', 'pianosaurus', 'pickypiggy', 'pj pug a pillar', 'poe', 'poppy playtime', 'prototype', 'rabie baby', 'simon smoke', 'the medic', 'the player', 'the scout', 'touille', 'yarnaby', 'bucky', 'catbee', 'dusky', 'limon', 'maggie mako', 'kick me paul', 'ai'];

        // Переменные для логики таймера
        let timerInterval = null;
        let totalSeconds = 0;
        let isTimerRunning = false;
        let isGameFinished = false;

        const timerElement = document.getElementById('game-timer');
        const sidebar = document.getElementById('sidebar');
        const playArea = document.getElementById('play-area');

        let draggedElementId = null;
        let draggedFromBoard = null;
        let draggedSidebarElement = null;

        // Расширенный звуковой движок на Web Audio API
        function playSound(type) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const now = ctx.currentTime;
                
                if (type === 'click') {
                    // Короткий чистый клик интерфейса
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.05);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                    
                } else if (type === 'close') {
                    // Клик понижающегося тона для закрытия
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.linearRampToValueAtTime(200, now + 0.08);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.08);
                    
                } else if (type === 'dragstart') {
                    // Легкий щелчок вверх при подборе предмета
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(350, now);
                    osc.frequency.exponentialRampToValueAtTime(700, now + 0.06);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.06);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.06);
                    
                } else if (type === 'board-drop') {
                    // Мягкий глухой стук при размещении на доске
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.1);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    
                } else if (type === 'success') {
                    // Переливающийся мажорный аккорд при успешном слиянии
                    const osc1 = ctx.createOscillator();
                    const gain1 = ctx.createGain();
                    osc1.type = 'triangle';
                    osc1.frequency.setValueAtTime(523.25, now); // C5
                    osc1.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5
                    gain1.gain.setValueAtTime(0.12, now);
                    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc1.connect(gain1);
                    gain1.connect(ctx.destination);
                    osc1.start(now);
                    osc1.stop(now + 0.25);

                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(659.25, now + 0.04); // E5
                    osc2.frequency.exponentialRampToValueAtTime(1318.51, now + 0.2); // E6
                    gain2.gain.setValueAtTime(0.12, now + 0.04);
                    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.start(now + 0.04);
                    osc2.stop(now + 0.3);
                    
                } else if (type === 'error') {
                    // Неприятный басовый блям (Sawtooth) при ошибке слияния
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(170, now);
                    osc.frequency.linearRampToValueAtTime(90, now + 0.2);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch (e) {
                console.log("Audio presentation blocked or unsupported:", e);
            }
        }

        // Инициализация таймера по клику
        timerElement.addEventListener('click', () => {
            if (!isTimerRunning && !isGameFinished) {
                playSound('click');
                isTimerRunning = true;
                timerElement.textContent = "00:00";
                timerInterval = setInterval(() => {
                    totalSeconds++;
                    let mins = Math.floor(totalSeconds / 60);
                    let secs = totalSeconds % 60;
                    timerElement.textContent = 
                        (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
                }, 1000);
            }
        });

        baseItems.forEach(id => {
            const el = createDOMItem(id);
            sidebar.appendChild(el);
        });

        function createDOMItem(id, isBoardItem = false, isResult = false) {
            const el = document.createElement('div');
            el.classList.add('item');
            
            if (isBoardItem) el.classList.add('board-item');
            if (isResult) el.classList.add('result-item');
            
            el.dataset.id = id;
            el.style.backgroundImage = `url('${id.toLowerCase()}.png')`; 
            el.draggable = true;

            el.addEventListener('dragstart', (e) => {
                draggedElementId = id;
                playSound('dragstart');

                if (isBoardItem) {
                    draggedFromBoard = el;
                    draggedSidebarElement = null;
                } else {
                    draggedFromBoard = null;
                    draggedSidebarElement = el;
                }

                const dragImg = document.createElement("div");
                dragImg.style.width = "80px";
                dragImg.style.height = "80px";
                dragImg.style.backgroundImage = el.style.backgroundImage;
                dragImg.style.backgroundSize = "contain";
                dragImg.style.backgroundRepeat = "no-repeat";
                dragImg.style.backgroundPosition = "center";
                dragImg.style.backgroundColor = "transparent";
                dragImg.style.border = "none";
                dragImg.style.boxShadow = "none";
                dragImg.style.position = "absolute";
                dragImg.style.top = "-9999px";

                document.body.appendChild(dragImg);
                e.dataTransfer.setDragImage(dragImg, 40, 40);

                setTimeout(() => {
                    document.body.removeChild(dragImg);
                }, 0);

                if (isBoardItem) {
                    el.style.opacity = "0.5";
                }
            });

            el.addEventListener('dragend', () => {
                if (draggedFromBoard) draggedFromBoard.style.opacity = '1';
            });

            el.addEventListener('dragover', (e) => e.preventDefault());

            el.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();

                if (!isBoardItem) return;

                const targetId = el.dataset.id;
                const sourceId = draggedElementId;

                const combination1 = `${sourceId}+${targetId}`;
                const combination2 = `${targetId}+${sourceId}`;
                const result = recipes[combination1] || recipes[combination2];

                if (result) {
                    discoveredItems.add(result);
                    playSound('success');

                    if (draggedFromBoard) {
                        draggedFromBoard.remove();
                    } else if (draggedSidebarElement) {
                        draggedSidebarElement.classList.add('disabled');
                        draggedSidebarElement.draggable = false;
                    }
                    
                    const newEl = createDOMItem(result, true, true); 
                    
                    const oldLeft = parseFloat(el.style.left);
                    const oldTop = parseFloat(el.style.top);
                    newEl.style.left = `${oldLeft - 20}px`;
                    newEl.style.top = `${oldTop - 20}px`;
                    
                    newEl.classList.add('success-pop');
                    playArea.appendChild(newEl);
                    el.remove(); 

                    // Проверяем, собран ли последний рецепт из списка
                    if (discoveredItems.size === allTargetItems.length && isTimerRunning) {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        isGameFinished = true;
                        timerElement.classList.add('finished'); // Делает таймер зеленым
                    }
                    
                } else {
                    playSound('error');
                    el.classList.remove('error-shake');
                    void el.offsetWidth; 
                    el.classList.add('error-shake');
                    
                    if (draggedFromBoard) draggedFromBoard.style.opacity = '1';
                }
            });

            return el;
        }

        playArea.addEventListener('dragover', (e) => e.preventDefault());

        playArea.addEventListener('drop', (e) => {
            e.preventDefault();

            const rect = playArea.getBoundingClientRect();
            let isDraggingResult = draggedFromBoard && draggedFromBoard.classList.contains('result-item');
            let offset = isDraggingResult ? 60 : 40; 

            let x = e.clientX - rect.left - offset; 
            let y = e.clientY - rect.top - offset;

            if (draggedFromBoard) {
                draggedFromBoard.style.left = `${x}px`;
                draggedFromBoard.style.top = `${y}px`;
                draggedFromBoard.style.opacity = '1';
                playSound('board-drop');
            } else if (draggedSidebarElement) {
                const newEl = createDOMItem(draggedElementId, true);
                newEl.style.left = `${x}px`;
                newEl.style.top = `${y}px`;
                playArea.appendChild(newEl);
                playSound('board-drop');

                draggedSidebarElement.classList.add('disabled');
                draggedSidebarElement.draggable = false;
            }
        });

        sidebar.addEventListener('dragover', (e) => e.preventDefault());

        sidebar.addEventListener('drop', (e) => {
            e.preventDefault();
            
            if (draggedFromBoard && !draggedFromBoard.classList.contains('result-item')) {
                draggedFromBoard.remove(); 
                playSound('board-drop');
                
                const sidebarItem = sidebar.querySelector(`.item[data-id="${draggedElementId}"]`);
                if (sidebarItem) {
                    sidebarItem.classList.remove('disabled');
                    sidebarItem.draggable = true;
                }
            }
        });

        // --- ЛОГИКА КАТАЛОГА ---
        const overlay = document.getElementById('overlay');
        const bookIcon = document.getElementById('book-icon');
        const catalogPopup = document.getElementById('catalog-popup');
        const closePopupBtn = document.getElementById('close-popup');
        const catalogGrid = document.getElementById('catalog-grid');

        const hintIcon = document.getElementById('hint-icon');
        const hintPopup = document.getElementById('hint-popup');
        const closeHintPopupBtn = document.getElementById('close-hint-popup');
        const hintContainer = document.getElementById('hint-container');

        const settingsIcon = document.getElementById('settings-icon');
        const settingsPopup = document.getElementById('settings-popup');
        const closeSettingsPopupBtn = document.getElementById('close-settings-popup');
        const themeGrid = document.getElementById('theme-grid');

        // Список 10 темных и 5 светлых вариантов оформления
        const themes = [
            // Dark Themes
            { name: 'Midnight', body: 'linear-gradient(180deg, #1e1e2f, #252542)', play: 'radial-gradient(circle at center, #2d2d44 0%, #151522 100%)', sidebar: 'linear-gradient(180deg, #3a2e4d, #201a30)', itemBg: '#383854', text: '#e0e0e0', heading: '#fff' },
            { name: 'Deep Ocean', body: 'linear-gradient(180deg, #0b132b, #1c2541)', play: 'radial-gradient(circle at center, #1c2541 0%, #0b132b 100%)', sidebar: 'linear-gradient(180deg, #222525, #11141a)', itemBg: '#3a506b', text: '#e0e0e0', heading: '#fff' },
            { name: 'Crimson', body: 'linear-gradient(180deg, #2b0000, #4a0000)', play: 'radial-gradient(circle at center, #3d0c0c 0%, #1a0000 100%)', sidebar: 'linear-gradient(180deg, #360000, #1f0000)', itemBg: '#5c1d1d', text: '#e0e0e0', heading: '#fff' },
            { name: 'Matrix', body: 'linear-gradient(180deg, #0a0f0d, #141f1b)', play: 'radial-gradient(circle at center, #1b2e26 0%, #050807 100%)', sidebar: 'linear-gradient(180deg, #141f1b, #0a0f0d)', itemBg: '#223c30', text: '#e0e0e0', heading: '#fff' },
            { name: 'Cyber Neon', body: 'linear-gradient(180deg, #240046, #3c0066)', play: 'radial-gradient(circle at center, #5a189a 0%, #10002b 100%)', sidebar: 'linear-gradient(180deg, #3c0066, #10002b)', itemBg: '#7b2cbf', text: '#e0e0e0', heading: '#fff' },
            { name: 'Charcoal', body: 'linear-gradient(180deg, #121212, #1c1c1c)', play: 'radial-gradient(circle at center, #292929 0%, #0a0a0a 100%)', sidebar: 'linear-gradient(180deg, #1c1c1c, #121212)', itemBg: '#333333', text: '#e0e0e0', heading: '#fff' },
            { name: 'Amethyst', body: 'linear-gradient(180deg, #2c1a4d, #1a0f33)', play: 'radial-gradient(circle at center, #3d2466 0%, #130a26 100%)', sidebar: 'linear-gradient(180deg, #23153c, #130a26)', itemBg: '#4b327a', text: '#e0e0e0', heading: '#fff' },
            { name: 'Glacier', body: 'linear-gradient(180deg, #041f26, #073b4c)', play: 'radial-gradient(circle at center, #0c5066 0%, #021114 100%)', sidebar: 'linear-gradient(180deg, #073b4c, #021114)', itemBg: '#118ab2', text: '#e0e0e0', heading: '#fff' },
            { name: 'Amber', body: 'linear-gradient(180deg, #1f1402, #332204)', play: 'radial-gradient(circle at center, #4d3306 0%, #140d01 100%)', sidebar: 'linear-gradient(180deg, #332204, #140d01)', itemBg: '#66460c', text: '#e0e0e0', heading: '#fff' },
            { name: 'Blood Moon', body: 'linear-gradient(180deg, #260f04, #3d1908)', play: 'radial-gradient(circle at center, #54230c 0%, #140702 100%)', sidebar: 'linear-gradient(180deg, #3d1908, #140702)', itemBg: '#733111', text: '#e0e0e0', heading: '#fff' },
            // Light Themes
            { name: 'Lavender', body: 'linear-gradient(180deg, #f0f0f5, #e6e6fa)', play: 'radial-gradient(circle at center, #ffffff 0%, #dcdcf7 100%)', sidebar: 'linear-gradient(180deg, #e6e6fa, #d1d1f0)', itemBg: '#b0c4de', text: '#2c2c4d', heading: '#1c1c3a' },
            { name: 'Mint Cream', body: 'linear-gradient(180deg, #f3faf6, #e8f5e9)', play: 'radial-gradient(circle at center, #ffffff 0%, #c8e6c9 100%)', sidebar: 'linear-gradient(180deg, #e8f5e9, #b2dfdb)', itemBg: '#a5d6a7', text: '#1b5e20', heading: '#0a3d12' },
            { name: 'Sakura', body: 'linear-gradient(180deg, #fff0f5, #ffe4e1)', play: 'radial-gradient(circle at center, #ffffff 0%, #ffccd5 100%)', sidebar: 'linear-gradient(180deg, #ffe4e1, #ffb6c1)', itemBg: '#ffccd5', text: '#4a1525', heading: '#310714' },
            { name: 'Vanilla Sky', body: 'linear-gradient(180deg, #fdfbf7, #f5f0e6)', play: 'radial-gradient(circle at center, #ffffff 0%, #eaddca 100%)', sidebar: 'linear-gradient(180deg, #f5f0e6, #dfd5c6)', itemBg: '#d2b48c', text: '#3e2723', heading: '#271206' },
            { name: 'Arctic Ice', body: 'linear-gradient(180deg, #f4fafd, #e0eeee)', play: 'radial-gradient(circle at center, #ffffff 0%, #cce6ff 100%)', sidebar: 'linear-gradient(180deg, #e0eeee, #bfe3f2)', itemBg: '#afeeee', text: '#004d40', heading: '#002d24' }
        ];

        // Генерация тайлов выбора тем в настройках
        themes.forEach((theme, index) => {
            const tile = document.createElement('div');
            tile.classList.add('theme-option');
            tile.style.background = theme.play;
            tile.textContent = theme.name;
            if (index === 0) tile.classList.add('active');

            tile.addEventListener('click', () => {
                playSound('click');
                document.querySelectorAll('.theme-option').forEach(t => t.classList.remove('active'));
                tile.classList.add('active');

                // Применение CSS-переменных темы оформления
                const root = document.documentElement;
                root.style.setProperty('--body-bg', theme.body);
                root.style.setProperty('--play-bg', theme.play);
                root.style.setProperty('--sidebar-bg', theme.sidebar);
                root.style.setProperty('--item-bg', theme.itemBg);
                root.style.setProperty('--text-color', theme.text);
                root.style.setProperty('--text-heading', theme.heading);
            });

            themeGrid.appendChild(tile);
        });

        function updateCatalog() {
            catalogGrid.innerHTML = ''; 
            allTargetItems.forEach(id => {
                const tile = document.createElement('div');
                tile.classList.add('catalog-tile');
                
                const img = document.createElement('img');
                img.src = `${id.toLowerCase()}.png`;
                img.classList.add('catalog-img');
                
                if (!discoveredItems.has(id)) {
                    img.classList.add('undiscovered');
                }
                
                tile.appendChild(img);
                catalogGrid.appendChild(tile);
            });
        }

        function showRandomHint() {
            hintContainer.innerHTML = '';
            
            const recipeKeys = Object.keys(recipes);
            if (recipeKeys.length === 0) return;

            const randomRecipeKey = recipeKeys[Math.floor(Math.random() * recipeKeys.length)];
            const resultItemName = recipes[randomRecipeKey];
            
            const parts = randomRecipeKey.split('+');
            const item1 = parts[0];
            const item2 = parts[1];

            const row = document.createElement('div');
            row.classList.add('hint-row');

            const tile1 = document.createElement('div');
            tile1.classList.add('hint-tile');
            const img1 = document.createElement('img');
            img1.src = `${item1.toLowerCase()}.png`;
            img1.classList.add('hint-img');
            tile1.appendChild(img1);

            const plusSign = document.createElement('span');
            plusSign.classList.add('hint-sign');
            plusSign.textContent = '+';

            const tile2 = document.createElement('div');
            tile2.classList.add('hint-tile');
            const img2 = document.createElement('img');
            img2.src = `${item2.toLowerCase()}.png`;
            img2.classList.add('hint-img');
            tile2.appendChild(img2);

            const equalsSign = document.createElement('span');
            equalsSign.classList.add('hint-sign');
            equalsSign.textContent = '=';

            const tileResult = document.createElement('div');
            tileResult.classList.add('hint-tile');
            const imgResult = document.createElement('img');
            imgResult.src = `${resultItemName.toLowerCase()}.png`;
            imgResult.classList.add('hint-img');
            tileResult.appendChild(imgResult);

            row.appendChild(tile1);
            row.appendChild(plusSign);
            row.appendChild(tile2);
            row.appendChild(equalsSign);
            row.appendChild(tileResult);

            hintContainer.appendChild(row);
        }

        function openCatalog() {
            playSound('click');
            updateCatalog();
            overlay.classList.add('active');
            catalogPopup.classList.add('active');
        }

        function closeCatalog() {
            playSound('close');
            overlay.classList.remove('active');
            catalogPopup.classList.remove('active');
        }

        function openHints() {
            playSound('click');
            showRandomHint();
            overlay.classList.add('active');
            hintPopup.classList.add('active');
        }

        function closeHints() {
            playSound('close');
            overlay.classList.remove('active');
            hintPopup.classList.remove('active');
        }

        function openSettings() {
            playSound('click');
            overlay.classList.add('active');
            settingsPopup.classList.add('active');
        }

        function closeSettings() {
            playSound('close');
            overlay.classList.remove('active');
            settingsPopup.classList.remove('active');
        }

        bookIcon.addEventListener('click', openCatalog);
        closePopupBtn.addEventListener('click', closeCatalog);
        
        hintIcon.addEventListener('click', openHints);
        closeHintPopupBtn.addEventListener('click', closeHints);

        settingsIcon.addEventListener('click', openSettings);
        closeSettingsPopupBtn.addEventListener('click', closeSettings);

        overlay.addEventListener('click', () => {
            closeCatalog();
            closeHints();
            closeSettings();
        });
    </script>
</body>
</html>
